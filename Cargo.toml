[workspace]
resolver = "2"
members = [
    "crates/susuki-decode",
    "crates/susuki-logo-file",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"

[workspace.dependencies]
susuki-decode = { path = "crates/susuki-decode" }
susuki-logo-file = { path = "crates/susuki-logo-file" }

[profile.release]
codegen-units = 1
lto = "thin"
